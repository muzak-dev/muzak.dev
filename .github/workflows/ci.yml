name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pnpm version is pinned by `packageManager` in package.json, so this
      # action reads it from there rather than being told twice.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The docs are the product here, so a page that fails to render is a
      # build failure rather than something to notice in review.
      - name: Check the generated artifacts
        run: |
          test -d .output || { echo "no .output directory"; exit 1; }
          echo "built ok"
